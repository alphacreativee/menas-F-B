  <body class="footer-no-line">
    <script>
      fetch("./components/header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
          const currentSegment = (
            window.location.pathname.split("/").pop() || ""
          ).toLowerCase();
          document.querySelectorAll(".header-menu ul>li>a").forEach((link) => {
            const linkSegment = (link.getAttribute("href") || "")
              .replace(/^\.\//, "")
              .split("/")
              .pop()
              .toLowerCase();
            if (linkSegment === currentSegment) link.classList.add("active");
          });
        });
    </script>
    <header id="header" class="header position-fixed"></header>

          >
            <div class="banner-contact">
              <h3 class="font-heading heading-3 color-primary">Liên hệ</h3>
              <address class="box-add">
                <p>
                  Lầu 11, ABACUS TOWER, 58 Nguyễn Đình Chiểu, P. Tân Định, TP.
                  Hồ Chí Minh
                </p>
              </address>
              <div class="list-phone">
                <a href="tel:02871089689">028 71 089 689</a> |
                <a href="tel:02871089689">028 71 089 689</a>
              </div>
              <a href="mailto:info@menasvietnam.com" class="email"
                >info@menasvietnam.com</a
              >
              <nav class="box-social" aria-label="Mạng xã hội">
                <a href="#" aria-label="TikTok" class="footer-social-link">

            </div>
          </div>
          <div
            class="banner-right banner-bg"
            style="--bg: url(&quot;../../images/del/contact-1.jpg&quot;)"
          >
            <div class="banner-form">
              <form action="">
                <div class="form-row">
                  <div
                    class="form-title font-heading heading-4 fw-bold color-white"
                  >
                    Gửi thông tin
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-item">
                    <input
                      type="text"
                      id="fullname"
                      name="fullname"
                      placeholder=" "
                      required
                    />
                    <label for="fullname">Tên quý khách *</label>
                  </div>
                </div>
                <div class="form-row two-item">
                  <div class="form-item">
                    <input
                      type="tel"
                      id="phone"
                      name="phone"
                      placeholder=" "
                      inputmode="tel"
                      autocomplete="tel"
                      pattern="[0-9+\s().-]{8,15}"
                      required
                    />
                    <label for="phone">Số điện thoại *</label>
                  </div>

                  <div class="form-item">
                    <input
                      type="email"
                      id="email"
                      name="email"
                      placeholder=" "
                      autocomplete="email"
                      required
                    />
                    <label for="email">Email *</label>
                  </div>
                </div>
                <div class="form-row two-item">
                  <div class="form-item">
                    <input
                      type="text"
                      id="company"
                      name="company"
                      placeholder=" "
                      autocomplete="organization"
                    />
                    <label for="company">Tên công ty</label>
                  </div>

                  <div class="form-item">
                    <input
                      type="url"
                      id="website"
                      name="website"
                      placeholder=" "
                      inputmode="url"
                      autocomplete="url"
                    />
                    <label for="website">Website</label>
                  </div>
                </div>
                <div class="form-item form-item-textarea">
                  <textarea
                    id="note"
                    name="note"
                    placeholder=" "
                    rows="4"
                  ></textarea>
                  <label for="note">Ghi chú</label>
                </div>
                <div class="form-row">
                  <button class="btn-global btn-bg">Gửi</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script>
      fetch("./components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
    <footer id="footer" class="style-section"></footer>
    <script src="./assets/libs/jquery-3.7.1.js"></script>
    <script src="./assets/libs/lenis.min.js"></script>
    <script src="./assets/libs/gsap.min.js"></script>
    <script src="./assets/libs/ScrollTrigger.min.js"></script>

    <script type="module" src="./assets/main/js/script.min.js"></script>

    <script>
      document.querySelector(".banner-form form")?.addEventListener("submit", (event) => {
        event.preventDefault();
      });
    </script>
